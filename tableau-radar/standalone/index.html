<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health indicators by WHO region</title>
<style>
/* ctab-panel 1.0.0 styles. Colors come from the --cp-* variables ctab-panel.js sets per theme.
   Text is never below 14px. No range inputs. Everything animates only opacity/transform, briefly. */
.cp-gear { position: absolute; top: 8px; right: 8px; z-index: 40; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; border: 2px solid var(--cp-border, #6b7a8c); background: var(--cp-bg, #fff); color: var(--cp-ink, #14202e); cursor: pointer; padding: 0; opacity: .82; transition: opacity .15s; }
.cp-gear:hover, .cp-gear:focus-visible { opacity: 1; }
.cp-gear[hidden], .cp-panel[hidden] { display: none !important; }

.cp-panel { --cp-bg: #ffffff; --cp-surface: #f2f4f8; --cp-ink: #14202e; --cp-muted: #3d4b5e; --cp-border: #6b7a8c; --cp-accent: #0a54a0; --cp-danger: #a3180e;
  position: absolute; left: 0; top: 0; z-index: 50; box-sizing: border-box; width: min(400px, calc(100% - 16px)); height: min(640px, calc(100% - 16px));
  display: flex; flex-direction: column; overflow: hidden; border-radius: 14px; border: 1px solid var(--cp-border);
  background: var(--cp-bg); color: var(--cp-ink); font: 14px/1.4 Inter, "Segoe UI", system-ui, Arial, sans-serif; box-shadow: 0 10px 34px rgba(0, 0, 0, .28); text-align: left; }
.cp-panel *, .cp-panel *::before, .cp-panel *::after { box-sizing: border-box; }
.cp-panel:focus { outline: none; }
.cp-panel.cp-dragging { user-select: none; box-shadow: 0 16px 44px rgba(0, 0, 0, .36); }
.cp-panel.cp-min { height: auto; }
.cp-panel.cp-min .cp-main { display: none; }

.cp-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; background: var(--cp-surface); color: var(--cp-ink); cursor: grab; touch-action: none; user-select: none; border-bottom: 1px solid var(--cp-border); }
.cp-panel.cp-dragging .cp-head { cursor: grabbing; }
.cp-head:focus-visible { outline: 3px solid var(--cp-accent); outline-offset: -3px; }
.cp-grip { color: var(--cp-muted); font-size: 18px; letter-spacing: -3px; }
.cp-title { margin: 0; flex: 1; font-size: 16px; font-weight: 700; color: var(--cp-ink); }
.cp-ib { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--cp-border); background: var(--cp-bg); color: var(--cp-ink); border-radius: 8px; font: 700 20px/1 Inter, "Segoe UI", system-ui, sans-serif; cursor: pointer; padding: 0; }

.cp-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cp-search { padding: 8px 14px 4px; }
.cp-q { width: 100%; }
.cp-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 14px 8px; }
.cp-tab { border: 1px solid var(--cp-border); background: var(--cp-bg); color: var(--cp-ink); border-radius: 999px; padding: 3px 10px; min-height: 30px; font: 600 14px/1.2 Inter, "Segoe UI", system-ui, Arial, sans-serif; cursor: pointer; }
.cp-tab[aria-selected="true"] { background: var(--cp-ink); color: var(--cp-bg); border-color: var(--cp-ink); }
.cp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 14px 12px; border-top: 1px solid var(--cp-border); background: var(--cp-bg); overscroll-behavior: contain; }
.cp-sec { margin: 14px 0 6px; font-size: 14px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--cp-accent); }
.cp-count, .cp-empty { margin: 10px 0; color: var(--cp-muted); }
.cp-row { display: grid; grid-template-columns: minmax(0, 38%) minmax(0, 1fr); gap: 3px 10px; align-items: center; margin: 8px 0; }
.cp-lab { color: var(--cp-ink); font-weight: 600; }
.cp-full { grid-column: 1 / 3; }
.cp-help { grid-column: 1 / 3; color: var(--cp-muted); font-size: 14px; }
.cp-check { display: flex; gap: 10px; align-items: center; cursor: pointer; font-weight: 600; min-height: 32px; }
.cp-check input { width: 20px; height: 20px; accent-color: var(--cp-accent); flex: none; }

.cp-panel input[type=text], .cp-panel input[type=number], .cp-panel select, .cp-panel textarea { width: 100%; min-width: 0; min-height: 34px; border: 1px solid var(--cp-border); border-radius: 8px;
  padding: 4px 8px; background: var(--cp-bg); color: var(--cp-ink); font: 14px/1.3 Inter, "Segoe UI", system-ui, Arial, sans-serif; }
.cp-panel select option { background: var(--cp-bg); color: var(--cp-ink); }
.cp-panel textarea { resize: vertical; }
.cp-panel input::placeholder, .cp-panel textarea::placeholder { color: var(--cp-muted); opacity: 1; }
.cp-panel input[type=number] { -moz-appearance: textfield; appearance: textfield; text-align: center; }
.cp-panel input[type=number]::-webkit-outer-spin-button, .cp-panel input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.cp-num { display: flex; align-items: center; gap: 4px; }
.cp-num input { flex: 1; width: auto; }
.cp-unit { color: var(--cp-muted); min-width: 22px; }
.cp-step { width: 34px; height: 34px; flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid var(--cp-border); background: var(--cp-bg); color: var(--cp-ink); border-radius: 8px; font: 700 18px/1 Inter, "Segoe UI", system-ui, sans-serif; cursor: pointer; }
.cp-color { display: flex; align-items: center; gap: 6px; }
.cp-color input[type=color], .cp-lcol { width: 44px; height: 34px; flex: none; padding: 2px; border: 1px solid var(--cp-border); border-radius: 8px; background: var(--cp-bg); cursor: pointer; }
.cp-hex { width: 96px !important; font-family: inherit; }
.cp-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.cp-chip { border: 1px solid var(--cp-border); background: var(--cp-bg); color: var(--cp-ink); border-radius: 8px; padding: 4px 10px; min-height: 32px; font: 600 14px/1.2 Inter, "Segoe UI", system-ui, Arial, sans-serif; cursor: pointer; }
.cp-chip[aria-pressed="true"], .cp-pal[aria-pressed="true"] { background: var(--cp-ink); color: var(--cp-bg); border-color: var(--cp-ink); }
.cp-pals { grid-column: 1 / 3; display: grid; gap: 4px; }
.cp-lab + .cp-pals { grid-column: 1 / 3; }
.cp-pal { display: flex; align-items: center; gap: 10px; border: 1px solid var(--cp-border); background: var(--cp-bg); color: var(--cp-ink); border-radius: 8px; padding: 4px 8px; min-height: 34px; font: 600 14px/1.2 Inter, "Segoe UI", system-ui, Arial, sans-serif; cursor: pointer; text-align: left; }
.cp-pname em { font-style: normal; font-weight: 400; }
.cp-strip { display: inline-flex; flex: 0 0 132px; width: 132px; border-radius: 4px; overflow: hidden; border: 1px solid var(--cp-border); }
.cp-strip i { display: block; flex: 1; height: 18px; }
.cp-list { display: grid; gap: 4px; }
.cp-li { display: flex; align-items: center; gap: 4px; }
.cp-li .cp-lname { flex: 1; }
.cp-li .cp-lshow { width: 20px; height: 20px; flex: none; accent-color: var(--cp-accent); }
.cp-btn { border: 1px solid var(--cp-border); background: var(--cp-bg); color: var(--cp-ink); border-radius: 8px; padding: 4px 12px; min-height: 34px; font: 600 14px/1.2 Inter, "Segoe UI", system-ui, Arial, sans-serif; cursor: pointer; }
.cp-small { padding: 2px 10px; min-height: 30px; }
.cp-primary { background: var(--cp-ink); color: var(--cp-bg); border-color: var(--cp-ink); }
.cp-status { min-height: 0; padding: 0 14px; color: var(--cp-muted); }
.cp-status:not(:empty) { padding: 6px 14px; border-top: 1px solid var(--cp-border); background: var(--cp-surface); }
.cp-err { color: var(--cp-danger); font-weight: 600; }
.cp-foot { padding: 8px 14px 12px; border-top: 1px solid var(--cp-border); background: var(--cp-surface); }
.cp-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.cp-extra { display: grid; gap: 6px; }
.cp-msg { min-height: 0; color: var(--cp-ink); font-weight: 600; }
.cp-msg.cp-err { color: var(--cp-danger); }

.cp-panel button:focus-visible, .cp-panel input:focus-visible, .cp-panel select:focus-visible, .cp-panel textarea:focus-visible, .cp-gear:focus-visible { outline: 3px solid var(--cp-accent); outline-offset: 1px; }

/* Under 420px wide the panel is a sheet that fills the whole frame; it scrolls as one piece. */
.cp-panel.cp-sheet { left: 0; top: 0; width: 100%; height: 100%; border-radius: 0; border: 0; transform: none !important; box-shadow: none; }
.cp-panel.cp-sheet .cp-head { cursor: default; }
.cp-panel.cp-sheet .cp-grip { display: none; }
.cp-panel.cp-sheet .cp-main { overflow-y: auto; }
.cp-panel.cp-sheet .cp-main > * { flex: none; }
.cp-panel.cp-sheet .cp-body { flex: none; overflow: visible; }
.cp-panel.cp-sheet .cp-tabs { flex-wrap: nowrap; overflow-x: auto; }
.cp-panel.cp-sheet .cp-tab { flex: none; }
.cp-panel.cp-sheet .cp-row { grid-template-columns: minmax(0, 1fr); }
.cp-panel.cp-sheet .cp-full, .cp-panel.cp-sheet .cp-help, .cp-panel.cp-sheet .cp-pals { grid-column: 1; }
.cp-panel.cp-sheet.cp-min { height: auto; }

@media (prefers-reduced-motion: reduce) { .cp-gear { transition: none; } }

/* Radar. Sans-serif only, 14px minimum text, colors come from the renderer (worksheet background aware). */
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
body { font: 14px/1.35 Inter, "Tableau Book", "Segoe UI", system-ui, Arial, sans-serif; }
#rd-root { position: absolute; inset: 0; overflow: hidden; }
.rd-chart { position: absolute; inset: 0; box-sizing: border-box; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.rd-title { flex: none; text-align: center; padding: 4px 8px 6px; line-height: 1.25; }
.rd-mid { flex: 1; min-height: 0; display: flex; flex-direction: row; min-width: 0; }
.rd-stage { flex: 1; position: relative; min-width: 0; min-height: 0; }
.rd-svg { position: absolute; left: 0; top: 0; display: block; max-width: 100%; max-height: 100%; overflow: hidden; touch-action: manipulation; }
.rd-legend { flex: none; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; justify-content: center; padding: 4px 6px; line-height: 1.25; }
.rd-legend-right { flex-direction: column; flex-wrap: nowrap; align-items: flex-start; justify-content: center; max-width: 40%; overflow-y: auto; }
.rd-lg-t { font-weight: 700; }
.rd-lg { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; background: transparent; color: inherit; font: inherit; padding: 2px 8px; border-radius: 999px; cursor: pointer; text-align: left; transition: opacity var(--rd-ms, .18s) ease, border-color .15s; }
.rd-lg:focus-visible { outline: 2px solid var(--rd-ink, #10202c); outline-offset: 1px; }
.rd-lg.is-on, .rd-lg[aria-pressed="true"] { border-color: var(--rd-muted, #4a5c66); }
.rd-legend:hover .rd-lg:not(.is-on):not(.rd-lg-bench) { opacity: .55; }
.rd-lg-bench { cursor: default; }
.rd-lg-sw { flex: none; width: 16px; height: 16px; border-radius: 4px; }
.rd-lg-dash { background: transparent; border-top: 3px dashed; border-radius: 0; height: 0; width: 20px; }
.rd-lg-n { min-width: 0; overflow-wrap: anywhere; }
.rd-note { flex: none; padding: 2px 10px 4px; text-align: center; color: var(--rd-muted, #4a5c66); line-height: 1.3; }
.rd-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; line-height: 1.4; }
.rd-s { cursor: pointer; transition: opacity var(--rd-ms, .18s) ease; outline: none; }
.rd-s:focus-visible .rd-shape { stroke-width: 4; }
.rd-s .rd-shape { pointer-events: all; }
.rd-svg.rd-focus .rd-s:not(.is-on) { opacity: var(--rd-dim, .25); }
.rd-svg.rd-iso .rd-s:not(.is-on) { opacity: 0; pointer-events: none; }
.rd-svg.rd-focus .rd-bench { opacity: .9; }
.rd-dhit { cursor: pointer; }
.rd-label, .rd-ringlabel, .rd-value, .rd-ptitle { pointer-events: none; user-select: none; }
.rd-tip { position: absolute; z-index: 20; left: 0; top: 0; display: none; max-width: var(--rd-tip-w, 280px); box-sizing: border-box; padding: 8px 10px; border-radius: 8px;
  background: var(--rd-tip-bg, #fff); color: var(--rd-ink, #10202c); border: 1px solid var(--rd-muted, #4a5c66); font-size: var(--rd-tip-size, 14px); line-height: 1.3; pointer-events: none; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); }
.rd-tip.on { display: block; }
.rd-tip-h { font-weight: 700; margin-bottom: 4px; }
.rd-tip-r { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.rd-tip-r.is-on { font-weight: 700; }
.rd-tip-n { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.rd-tip-v { flex: none; font-variant-numeric: tabular-nums; }
.rd-tip-sw { flex: none; width: 12px; height: 12px; border-radius: 3px; }
.rd-tip-m { color: var(--rd-muted, #4a5c66); margin-top: 2px; }
@media (prefers-reduced-motion: reduce) { .rd-s, .rd-lg { transition: none; } }

html, body { overflow: hidden; }
#root { position: absolute; inset: 0; }
#rd-root { position: absolute; inset: 0; }
</style>
