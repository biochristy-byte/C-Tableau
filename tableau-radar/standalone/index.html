.cp-gear { position: absolute; top: 8px; right: 8px; z-index: 40; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; border: 2px solid var(--cp-border, #6b7a8c); background: var(--cp-bg, #fff); color: var(--cp-ink, #14202e); cursor: pointer; padding: 0; opacity: .82; transition: opacity .15s; }
.cp-gear:hover, .cp-gear:focus-visible { opacity: 1; }
.cp-gear[hidden], .cp-panel[hidden] { display: none !important; }

.cp-panel { --cp-bg: #ffffff; --cp-surface: #f2f4f8; --cp-ink: #14202e; --cp-muted: #3d4b5e; --cp-border: #6b7a8c; --cp-accent: #0a54a0; --cp-danger: #a3180e;
  position: absolute; left: 0; top: 0; z-index: 50; box-sizing: border-box; width: min(400px, calc(100% - 16px)); height: min(640px, calc(100% - 16px));
  display: flex; flex-direction: column; overflow: hidden; border-radius: 14px; border: 1px solid var(--cp-border);
  background: var(--cp-bg); color: var(--cp-ink); font: 14px/1.4 Inter, "Segoe UI", system-ui, Arial, sans-serif; font-size: var(--cp-fs, 14px); box-shadow: 0 10px 34px rgba(0, 0, 0, .28); text-align: left; }
.cp-panel *, .cp-panel *::before, .cp-panel *::after { box-sizing: border-box; }
.cp-panel:focus { outline: none; }
.cp-panel.cp-dragging { user-select: none; box-shadow: 0 16px 44px rgba(0, 0, 0, .36); }
.cp-panel.cp-min { height: auto; }
.cp-panel.cp-min .cp-main { display: none; }

.cp-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; background: var(--cp-surface); color: var(--cp-ink); cursor: grab; touch-action: none; user-select: none; border-bottom: 1px solid var(--cp-border); }
.cp-panel.cp-dragging .cp-head { cursor: grabbing; }
.cp-head:focus-visible { outline: 3px solid var(--cp-accent); outline-offset: -3px; }
.cp-grip { color: var(--cp-muted); font-size: 18px; letter-spacing: -3px; }
.cp-title { margin: 0; flex: 1; min-width: 0; font-size: 1.15em; font-weight: 700; color: var(--cp-ink); }
.cp-ib { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--cp-border); background: var(--cp-bg); color: var(--cp-ink); border-radius: 8px; font: 700 20px/1 Inter, "Segoe UI", system-ui, sans-serif; cursor: pointer; padding: 0; }

.cp-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cp-search { padding: 8px 14px 4px; }
.cp-q { width: 100%; }
.cp-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 14px 8px; }
.cp-tab { border: 1px solid var(--cp-border); background: var(--cp-bg); color: var(--cp-ink); border-radius: 999px; padding: 3px 10px; min-height: 30px; font: 600 1em/1.2 Inter, "Segoe UI", system-ui, Arial, sans-serif; cursor: pointer; }
.cp-tab[aria-selected="true"] { background: var(--cp-ink); color: var(--cp-bg); border-color: var(--cp-ink); }
.cp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 14px 12px; border-top: 1px solid var(--cp-border); background: var(--cp-bg); overscroll-behavior: contain; }
.cp-sec { margin: 14px 0 6px; font-size: 1em; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--cp-accent); }
.cp-count, .cp-empty { margin: 10px 0; color: var(--cp-muted); }
.cp-row { display: grid; grid-template-columns: minmax(0, 38%) minmax(0, 1fr); gap: 3px 10px; align-items: center; margin: 8px 0; }
.cp-lab { color: var(--cp-ink); font-weight: 600; }
.cp-full { grid-column: 1 / 3; }
.cp-help { grid-column: 1 / 3; color: var(--cp-muted); font-size: 1em; }
.cp-check { display: flex; gap: 10px; align-items: center; cursor: pointer; font-weight: 600; min-height: 32px; }
.cp-check input { width: 20px; height: 20px; accent-color: var(--cp-accent); flex: none; }

.cp-panel input[type=text], .cp-panel input[type=number], .cp-panel select, .cp-panel textarea { width: 100%; min-width: 0; min-height: 34px; border: 1px solid var(--cp-border); border-radius: 8px;
  padding: 4px 8px; background: var(--cp-bg); color: var(--cp-ink); font: 1em/1.3 Inter, "Segoe UI", system-ui, Arial, sans-serif; }
.cp-panel select option { background: var(--cp-bg); color: var(--cp-ink); }
.cp-panel textarea { resize: vertical; }
.cp-panel input::placeholder, .cp-panel textarea::placeholder { color: var(--cp-muted); opacity: 1; }
.cp-panel input[type=number] { -moz-appearance: textfield; appearance: textfield; text-align: center; }
.cp-panel input[type=number]::-webkit-outer-spin-button, .cp-panel input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.cp-num { display: flex; align-items: center; gap: 4px; }
.cp-num input { flex: 1; width: auto; }
.cp-unit { color: var(--cp-muted); min-width: 22px; }
.cp-step { width: 34px; height: 34px; flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid var(--cp-border); background: var(--cp-bg); color: var(--cp-ink); border-radius: 8px; font: 700 18px/1 Inter, "Segoe UI", system-ui, sans-serif; cursor: pointer; }
.cp-color { display: flex; align-items: center; gap: 6px; }
.cp-color input[type=color], .cp-lcol { width: 44px; height: 34px; flex: none; padding: 2px; border: 1px solid var(--cp-border); border-radius: 8px; background: var(--cp-bg); cursor: pointer; }
.cp-hex { width: 96px !important; font-family: inherit; }
.cp-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.cp-chip { border: 1px solid var(--cp-border); background: var(--cp-bg); color: var(--cp-ink); border-radius: 8px; padding: 4px 10px; min-height: 32px; font: 600 1em/1.2 Inter, "Segoe UI", system-ui, Arial, sans-serif; cursor: pointer; }
.cp-chip[aria-pressed="true"], .cp-pal[aria-pressed="true"] { background: var(--cp-ink); color: var(--cp-bg); border-color: var(--cp-ink); }
.cp-pals { grid-column: 1 / 3; display: grid; gap: 4px; }
.cp-lab + .cp-pals { grid-column: 1 / 3; }
.cp-pal { display: flex; align-items: center; gap: 10px; border: 1px solid var(--cp-border); background: var(--cp-bg); color: var(--cp-ink); border-radius: 8px; padding: 4px 8px; min-height: 34px; font: 600 1em/1.2 Inter, "Segoe UI", system-ui, Arial, sans-serif; cursor: pointer; text-align: left; }
.cp-pname em { font-style: normal; font-weight: 400; }
.cp-strip { display: inline-flex; flex: 0 0 132px; width: 132px; border-radius: 4px; overflow: hidden; border: 1px solid var(--cp-border); }
.cp-strip i { display: block; flex: 1; height: 18px; }
.cp-list { display: grid; gap: 4px; }
.cp-li { display: flex; align-items: center; gap: 4px; }
.cp-li .cp-lname { flex: 1; }
.cp-li .cp-lshow { width: 20px; height: 20px; flex: none; accent-color: var(--cp-accent); }
.cp-btn { border: 1px solid var(--cp-border); background: var(--cp-bg); color: var(--cp-ink); border-radius: 8px; padding: 4px 12px; min-height: 34px; font: 600 1em/1.2 Inter, "Segoe UI", system-ui, Arial, sans-serif; cursor: pointer; }
.cp-small { padding: 2px 10px; min-height: 30px; }
.cp-primary { background: var(--cp-ink); color: var(--cp-bg); border-color: var(--cp-ink); }
.cp-status { min-height: 0; padding: 0 14px; color: var(--cp-muted); }
.cp-status:not(:empty) { padding: 6px 14px; border-top: 1px solid var(--cp-border); background: var(--cp-surface); }
.cp-err { color: var(--cp-danger); font-weight: 600; }
.cp-foot { display: grid; gap: 6px; padding: 8px 14px 12px; border-top: 1px solid var(--cp-border); background: var(--cp-surface); }
.cp-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.cp-extra { display: grid; gap: 6px; }
.cp-msg { min-height: 0; color: var(--cp-ink); font-weight: 600; }
.cp-msg.cp-err { color: var(--cp-danger); }

.cp-panel button:focus-visible, .cp-panel input:focus-visible, .cp-panel select:focus-visible, .cp-panel textarea:focus-visible, .cp-gear:focus-visible { outline: 3px solid var(--cp-accent); outline-offset: 1px; }

/* Under 420px wide the panel is a sheet that fills the whole frame; it scrolls as one piece. */
.cp-panel.cp-sheet { left: 0; top: 0; width: 100%; height: 100%; border-radius: 0; border: 0; transform: none !important; box-shadow: none; }
.cp-panel.cp-sheet .cp-head { cursor: default; }
.cp-panel.cp-sheet .cp-grip { display: none; }
.cp-panel.cp-sheet .cp-main { overflow: hidden; }
.cp-panel.cp-sheet .cp-main > * { flex: none; }
.cp-panel.cp-sheet .cp-tabs { flex-wrap: wrap; max-height: 38%; overflow-y: auto; overscroll-behavior: contain; }
.cp-panel.cp-sheet .cp-body { flex: 1 1 auto; min-height: 60px; overflow-y: auto; }
.cp-panel.cp-sheet .cp-foot { max-height: 40%; overflow-y: auto; }
.cp-panel.cp-sheet .cp-tab, .cp-panel.cp-sheet .cp-btn, .cp-panel.cp-sheet .cp-ib, .cp-panel.cp-sheet .cp-chip { min-height: 44px; }
.cp-panel.cp-sheet .cp-ib { min-width: 44px; }
.cp-panel.cp-sheet .cp-hd { display: none; }
.cp-panel.cp-sheet .cp-tab { flex: none; }
.cp-panel.cp-sheet .cp-row { grid-template-columns: minmax(0, 1fr); }
.cp-panel.cp-sheet .cp-full, .cp-panel.cp-sheet .cp-help, .cp-panel.cp-sheet .cp-pals { grid-column: 1; }
.cp-panel.cp-sheet.cp-min { height: auto; }

.cp-save { color: var(--cp-muted); }
.cp-save.cp-err { color: var(--cp-danger); font-weight: 600; }
.cp-footin { display: grid; gap: 6px; }
.cp-tabfoot { margin: 14px 0 4px; }
.cp-tabfoot { margin: 14px 0 4px; }
.cp-preview { color: var(--cp-ink); font-weight: 600; padding: 6px 10px; border: 1px solid var(--cp-border); border-radius: 8px; background: var(--cp-surface); }
.cp-diagtext { font-family: Consolas, "Cascadia Mono", Menlo, monospace !important; white-space: pre; }

/* A row that does not apply right now: grayed out by a dashed outline and a lock, never by opacity (7:1 holds). */
.cp-row.cp-off { border: 1px dashed var(--cp-border); border-radius: 8px; padding: 4px 6px; background: var(--cp-surface); }
.cp-offwhy { display: flex; align-items: center; gap: 6px; color: var(--cp-ink); font-weight: 600; }
.cp-lock { flex: none; color: var(--cp-ink); }
.cp-panel .cp-off input:disabled, .cp-panel .cp-off select:disabled, .cp-panel .cp-off button:disabled, .cp-panel .cp-off textarea:disabled {
  color: var(--cp-ink); -webkit-text-fill-color: var(--cp-ink); background: var(--cp-surface); border-style: dashed; opacity: 1; cursor: not-allowed; }
.cp-panel .cp-off .cp-chip[aria-pressed="true"]:disabled, .cp-panel .cp-off .cp-pal[aria-pressed="true"]:disabled { color: var(--cp-bg); -webkit-text-fill-color: var(--cp-bg); background: var(--cp-ink); border-style: solid; }

.cp-ib[aria-disabled="true"] { border-style: dashed; cursor: not-allowed; }

/* Pinned: a full-height strip on the right; the chart gives up that width (ctab-panel.js reserve()). */
.cp-panel.cp-pinned { left: auto; right: 0; top: 0; width: 360px; height: 100%; border-radius: 0; border-width: 0 0 0 1px; transform: none !important; box-shadow: -8px 0 24px rgba(0, 0, 0, .18); }
.cp-panel.cp-pinned.cp-min { height: auto; }

.cp-diagwrap .cp-btn:focus-visible { outline: 3px solid var(--cp-accent); outline-offset: 1px; }

@media (prefers-reduced-motion: reduce) { .cp-gear { transition: none; } }

/* Radar. Sans-serif only, 14px minimum text, colors come from the renderer (worksheet background aware). */
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
body { font: 14px/1.35 Inter, "Tableau Book", "Segoe UI", system-ui, Arial, sans-serif; }

.rd-stage { flex: 1; position: relative; min-width: 0; min-height: 0; }

.rd-lg-t { font-weight: 700; }

.rd-lg:focus-visible { outline: 2px solid var(--rd-ink, #10202c); outline-offset: 1px; }
.rd-lg.is-on, .rd-lg[aria-pressed="true"] { border-color: var(--rd-muted, #4a5c66); }
.rd-legend:hover .rd-lg:not(.is-on):not(.rd-lg-bench) { opacity: .55; }
.rd-lg-bench { cursor: default; }
.rd-lg-sw { flex: none; width: 16px; height: 16px; border-radius: 4px; }
.rd-lg-dash { background: transparent; border-top: 3px dashed; border-radius: 0; height: 0; width: 20px; }
.rd-lg-n { min-width: 0; overflow-wrap: anywhere; }
.rd-note { flex: none; padding: 2px 10px 4px; text-align: center; color: var(--rd-muted, #4a5c66); line-height: 1.3; }
.rd-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; line-height: 1.4; }
.rd-s { cursor: pointer; transition: opacity var(--rd-ms, .18s) ease; outline: none; }
.rd-s:focus-visible .rd-shape { stroke-width: 4; }
.rd-s .rd-shape { pointer-events: all; }
.rd-svg.rd-focus .rd-s:not(.is-on) { opacity: var(--rd-dim, .25); }
.rd-svg.rd-iso .rd-s:not(.is-on) { opacity: 0; pointer-events: none; }
.rd-svg.rd-focus .rd-bench { opacity: .9; }
.rd-dhit { cursor: pointer; }
.rd-label, .rd-ringlabel, .rd-value, .rd-ptitle { pointer-events: none; user-select: none; }
.rd-tip { position: absolute; z-index: 20; left: 0; top: 0; display: none; max-width: var(--rd-tip-w, 280px); box-sizing: border-box; padding: 8px 10px; border-radius: 8px;
  background: var(--rd-tip-bg, #fff); color: var(--rd-ink, #10202c); border: 1px solid var(--rd-muted, #4a5c66); font-size: var(--rd-tip-size, 14px); line-height: 1.3; pointer-events: none; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); }
.rd-tip.on { display: block; }
.rd-tip-h { font-weight: 700; margin-bottom: 4px; }
.rd-tip-r { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.rd-tip-r.is-on { font-weight: 700; }
.rd-tip-n { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.rd-tip-v { flex: none; font-variant-numeric: tabular-nums; }
.rd-tip-sw { flex: none; width: 12px; height: 12px; border-radius: 3px; }
.rd-tip-m { color: var(--rd-muted, #4a5c66); margin-top: 2px; }
@media (prefers-reduced-motion: reduce) { .rd-s, .rd-lg { transition: none; } }

html, body { overflow: hidden; }

#rd-root { position: absolute; inset: 0; }

    var h = 0, str = m.axes.map(function (a) { return a.key; }).join('|') + '#' + m.series.map(function (x) { return x.key + ':' + x.values.join(','); }).join('|');
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    m.key = String(h);
    return m;
  }

  /* ------------------------------------------------------------ Tableau out */

  function pushSelection(kind, key) {
    var ws = state.worksheet, s = state.store.get();
    if (!ws || !s.selectOn) return;
    var swallow = function (p) { if (p && p.catch) p.catch(function (e) { log('selection rejected', e); }); };
    try {
      if (kind === 'clear' || !key) { if (typeof ws.clearSelectedMarksAsync === 'function') swallow(ws.clearSelectedMarksAsync()); return; }
      var field = state.model.seriesName;
      if (kind === 'series' && field && typeof ws.selectMarksByValueAsync === 'function') {
        swallow(ws.selectMarksByValueAsync([{ fieldName: field, value: [key] }], 'select-replace'));
      }
    } catch (e) { log('selection threw', e); }
  }

  var lastHover = null;
  function pushHover(key) {
    var ws = state.worksheet, s = state.store.get();
    if (!ws || !s.hoverPush || typeof ws.hoverTupleAsync !== 'function') return;
    var tuple = 0;
    if (key) state.model.series.forEach(function (x) { if (x.key === key && x.tupleList.length) tuple = x.tupleList[0]; });
    if (tuple === lastHover) return;
    lastHover = tuple;
    try { var p = ws.hoverTupleAsync(tuple); if (p && p.catch) p.catch(function () { /* hover is cosmetic */ }); } catch (e) { /* cosmetic */ }
  }

  /* ----------------------------------------------------------------- render */

  function redraw() {
    if (!state.renderer) return;
    state.renderer.draw(state.model, state.store.get(), { onSelect: pushSelection, onHover: pushHover });
    if (state.panel && state.renderer.colors) state.panel.applyAppearance(state.renderer.colors.bg, state.renderer.colors.ink);
    if (state.panel) state.panel.render();
    diagOnEmpty();
    if (state.panel) { try { var pp = state.renderer.p; state.panel.trace({ marks: pp && pp.series && pp.axes ? pp.series.length * pp.axes.length : 0 }); } catch (e) { /* diagnostics only */ } }
  }
  function onChange(keys) {
    if (keys.some(function (k) { return DATA_KEYS[k]; })) state.model = buildModel();
    redraw();
  }

  var refreshing = false, queued = false;
  function refreshData() {
    if (!state.worksheet) return Promise.resolve();
    if (refreshing) { queued = true; return Promise.resolve(); }
    refreshing = true;
    var done = function () { refreshing = false; if (queued) { queued = false; return refreshData(); } return undefined; };
    return readData(state.worksheet).then(function (d) { state.raw = d; state.auto = d.auto; state.model = buildModel(); redraw(); }, function (e) {
      log('data refresh failed', e);
      state.raw = null; state.model = { axes: [], series: [], emptyMessage: 'Could not read data from this worksheet.' };
      redraw();
    }).then(done, done);
  }

  function info() {
    var d = state.raw, s = state.store.get(), m = state.model;
    return { columns: d ? d.raw.columns : [], numericColumns: d ? d.numeric : [], auto: d ? d.auto : {},
      lists: { axes: RD.axisItems(m), categories: RD.seriesItems(m, s) }, data: diagData(), tokens: diagTokens() };
  }

  /* What the diagnostics report and the title placeholders see. Cheap, and never throws. */
  function diagData() {
    try {
      var d = state.raw && state.raw.raw;
      if (!d) return { rows: 0, fields: [], sample: [] };
      var rows = d.rows, cols = d.columns;
      var fields = cols.map(function (c) {
        var t = 'text';
        for (var i = 0; i < rows.length; i++) { var v = rows[i][c]; if (v === null || v === undefined) continue; t = typeof v === 'number' ? 'number' : (v instanceof Date ? 'date' : typeof v === 'boolean' ? 'boolean' : 'text'); break; }
        return { name: c, type: t };
      });
      var sample = rows.slice(0, 4).map(function (r) {
        var o = {};
        cols.forEach(function (c) { o[c] = { value: r[c] === undefined ? null : r[c], formatted: r.__fmt ? r.__fmt[c] : '' }; });
        return o;
      });
      return { rows: rows.length, fields: fields, sample: sample };
    } catch (e) { return { rows: 0, fields: [], sample: [] }; }
  }
  /* A radar plots averages, so there is no natural sum: only the highest series (by mean) is offered. */
  function diagTokens() {
    try {
      var ser = state.model && state.model.series; if (!ser || !ser.length) return {};
      var top = null;
      ser.forEach(function (x) { if (typeof x.mean === 'number' && isFinite(x.mean) && (!top || x.mean > top.mean)) top = x; });
      return top ? { top: top.name } : {};
    } catch (e) { return {}; }
  }
  /* A Copy diagnostics button on the blank screen; a draw rebuilds the stage, so one at a time. */
  function diagOnEmpty() {
    try {
      var e = state.renderer && state.renderer.stage && state.renderer.stage.querySelector('.rd-empty');
      if (e && !e.querySelector('.cp-diagwrap')) CP.diagButton(e, { panel: state.panel });
    } catch (x) { log('diag button failed', x); }
  }

  function mount(ws) {
    state.worksheet = ws;
    state.store = CP.createStore({ rows: SET.prepared.rows, settings: global.tableau.extensions.settings, prefix: PREFIX, onChange: onChange, log: log });
    state.store.load();
    var root = document.getElementById('rd-root'), chart = document.getElementById('rd-chart');
    state.renderer = new RD.Renderer(chart);
    state.panel = CP.create(root, { title: 'Radar settings', schema: SET.schema, store: state.store, info: info, state: state.store.panelState, prefix: PREFIX, version: '1.0.0' });
    /* Redraw only when the chart box really changed size. ResizeObserver also fires once on observe(); a redraw then would
     * replace the SVG under a hover that already started and cut its fade short. */
    var lastW = -1, lastH = -1;
    function sizeChanged() {
      var r = chart.getBoundingClientRect(), w = Math.round(r.width), h = Math.round(r.height);
      if (w === lastW && h === lastH) return false;
      lastW = w; lastH = h; return true;
    }
    function onSize() {
      if (state.resizeTimer) clearTimeout(state.resizeTimer);
      state.resizeTimer = setTimeout(function () { state.resizeTimer = null; if (sizeChanged()) redraw(); }, 60);
    }
    sizeChanged();
    global.addEventListener('resize', onSize);
    if (typeof global.ResizeObserver === 'function') new global.ResizeObserver(onSize).observe(chart);
    if (ws.addEventListener) {
      var T = global.tableau.TableauEventType || {};
      [T.SummaryDataChanged, T.FilterChanged, T.ParameterChanged, T.WorksheetFormattingChanged].forEach(function (evt) {
        if (!evt) return;
        try { ws.addEventListener(evt, refreshData); } catch (e) { log('listener failed for', evt, e); }
      });
    }
    return refreshData();
  }

  function boot() {
    if (!global.tableau || !global.tableau.extensions) { log('Tableau Extensions API not present'); return; }
    global.tableau.extensions.initializeAsync().then(function () {
      var wc = global.tableau.extensions.worksheetContent;
      if (!wc || !wc.worksheet) { log('no worksheetContent: load this as a viz extension, not a dashboard extension'); return; }
      return mount(wc.worksheet);
    }).catch(function (e) {
      log('initializeAsync failed', e);
      var chart = document.getElementById('rd-chart');
      if (chart) { chart.innerHTML = ''; var d = document.createElement('div'); d.className = 'rd-empty'; d.textContent = 'This extension could not start. Check the browser console for details.'; chart.appendChild(d); try { CP.diagButton(d, { panel: state.panel }); } catch (x) { /* no panel yet */ } }
    });
  }

  RD.app = { boot: boot, mount: mount, refreshData: refreshData, redraw: redraw, state: state };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
