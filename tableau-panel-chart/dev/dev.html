<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Chart development harness</title>
  <link rel="stylesheet" href="../lib/ctab-panel/ctab-panel.css">
  <link rel="stylesheet" href="../src/css/panelchart.css">
  <style>
    /* Harness chrome only. None of it ships inside the extension. */
    html, body { overflow: auto; height: auto; background: #eef1f4; }
    body { font: 14px/1.45 "Segoe UI", system-ui, Arial, sans-serif; color: #10202c; padding: 14px; }
    .hz { max-width: 1680px; margin: 0 auto; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; background: #fff; border: 1px solid #c9d2da; border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
    .fld { display: flex; flex-direction: column; gap: 4px; }
    .fld label { font-size: 14px; font-weight: 600; }
    .fld select { height: 32px; border: 1px solid #8a9aa6; border-radius: 6px; padding: 0 6px; font: inherit; background: #fff; }
    #stage { position: relative; width: 900px; height: 520px; overflow: hidden; border: 1px solid #8a9aa6; border-radius: 8px; }
    .evt { margin-top: 8px; font: 14px ui-monospace, Consolas, monospace; background: #fff; border: 1px solid #c9d2da; border-radius: 6px; padding: 7px 9px; min-height: 34px; }
    /* bare=1: the stage is the whole page, as the extension's own frame is inside Tableau. */
    html.bare, body.bare { height: 100%; overflow: hidden; }
    body.bare { padding: 0; margin: 0; }
    body.bare .hz { max-width: none; height: 100%; }
    body.bare .hz > :not(#stage) { display: none; }
    body.bare #stage { border: 0; border-radius: 0; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
<div class="hz">
  <h1>Panel Chart development harness</h1>
  <div>Runs the shipping extension code against a mock of the Tableau Extensions API. URL options: fixture, size (WxH), theme (light or dark), bare=1.</div>
  <div class="bar">
    <div class="fld"><label for="fx">Dataset</label><select id="fx"></select></div>
    <div class="fld"><label for="sz">Stage size</label>
      <select id="sz"><option>900x520</option><option>1280x800</option><option>1600x1000</option><option>390x700</option><option>300x300</option></select></div>
    <div class="fld"><label for="th">Worksheet background</label>
      <select id="th"><option value="light">Light</option><option value="dark">Dark (Data Divers navy)</option></select></div>
  </div>
  <div id="stage"><div id="pc-root"><div id="pc-chart"></div></div></div>
  <div class="evt" id="evt">Tableau API calls from the extension appear here.</div>
</div>

<script src="fixtures.js"></script>
<script src="mock-tableau.js"></script>
<script src="../lib/ctab-panel/ctab-panel.js"></script>
<script src="../src/js/settings.js"></script>
<script src="../src/js/model.js"></script>
<script src="../src/js/render.js"></script>
<script>
  (function () {
    var q = new URLSearchParams(location.search), fx = document.getElementById('fx'), M = window.PC_MOCK;
    var sz = q.get('size') || '900x520', th = q.get('theme') || 'light', st = document.getElementById('stage');
    if (q.get('bare') === '1') { document.body.classList.add('bare'); document.documentElement.classList.add('bare'); }
    var p = sz.split('x'); st.style.width = p[0] + 'px'; st.style.height = p[1] + 'px';
    document.getElementById('th').value = th;
    M.worksheet.backgroundColor = th === 'dark' ? '#081f33' : '#ffffff';
    Object.keys(window.PC_FIXTURES).forEach(function (k) { var o = document.createElement('option'); o.value = k; o.textContent = window.PC_FIXTURES[k].label; fx.appendChild(o); });
    function shelves(key) {
      var e = window.PC_FIXTURES[key].enc, out = {};
      Object.keys(e).forEach(function (id) { out[id] = e[id] ? { name: e[id], fieldId: 'f-' + e[id] } : null; });
      M.worksheet._encodings = out;
    }
    var first = q.get('fixture') || 'sales';
    fx.value = first; shelves(first); M.worksheet._fixtureKey = first;
    window.PC_READY = new Promise(function (res) { var s = document.createElement('script'); s.src = '../src/js/app.js'; s.onload = res; document.body.appendChild(s); });
    fx.addEventListener('change', function () { shelves(fx.value); M.setFixture(fx.value); });
    document.getElementById('th').addEventListener('change', function () { M.setBackground(this.value === 'dark' ? '#081f33' : '#ffffff'); });
    document.getElementById('sz').addEventListener('change', function () { var p2 = this.value.split('x'); st.style.width = p2[0] + 'px'; st.style.height = p2[1] + 'px'; window.dispatchEvent(new Event('resize')); });
    var evt = document.getElementById('evt');
    function show(m) { evt.textContent = new Date().toLocaleTimeString() + '  ' + m; }
    window.addEventListener('pc-mock-select', function (e) { show('select ' + JSON.stringify(e.detail.sel) + ' ' + e.detail.type); });
    window.addEventListener('pc-mock-hover', function (e) { show('hoverTupleAsync(' + e.detail.tuple + ')'); });
    if (window.ResizeObserver) new ResizeObserver(function () { window.dispatchEvent(new Event('resize')); }).observe(st);
  })();
</script>
</body>
</html>
