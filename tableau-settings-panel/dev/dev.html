<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings Panel dev dashboard</title>
<link rel="stylesheet" href="../lib/ctab-panel/ctab-panel.css">
<link rel="stylesheet" href="../src/css/sp.css">
<style>
  html, body { height: auto; }
  body { margin: 0; background: #e9edf2; color: #14202e; font: 14px/1.4 Inter, "Segoe UI", system-ui, Arial, sans-serif; }
  #bar { padding: 8px 16px; }
  #dash { position: relative; width: 1440px; height: 900px; background: #ffffff; margin: 0 16px 16px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; padding: 12px; box-sizing: border-box; }
  .sheet { border: 1px solid #6b7a8c; border-radius: 8px; padding: 10px 14px; overflow: hidden; }
  .sheet h3 { margin: 0 0 6px; font-size: 16px; }
  .sheet pre { margin: 0; font: 14px/1.4 Consolas, monospace; white-space: pre-wrap; }
  #zone { position: absolute; z-index: 5; }
  body.solo #dash { width: auto; height: auto; display: block; padding: 0; margin: 0; background: transparent; }
  body.solo .sheet, body.solo #bar { display: none; }
  body.solo #zone { position: relative; left: 0 !important; top: 0 !important; }
</style>
</head>
<body>
<div id="bar">Mock dashboard for the Settings Panel extension. URL options: zone=WxH (fixed zone, no resizing), solo=1 (the zone alone), settings=JSON.</div>
<div id="dash">
  <div class="sheet" id="s0"><h3>Sales by Region</h3><pre></pre></div>
  <div class="sheet" id="s1"><h3>Profit Trend</h3><pre></pre></div>
  <div class="sheet" id="s2"><h3>Orders</h3><pre></pre></div>
  <div class="sheet" id="pp"><h3>Parameters</h3><pre></pre></div>
  <div id="zone"><div id="sp-root"></div></div>
</div>
<script>
  (function () {
    var q = new URLSearchParams(location.search), pre = {};
    try { pre = JSON.parse(q.get('settings') || '{}'); } catch (e) { pre = {}; }
    if (q.get('zone')) { pre['sp.panel'] = JSON.stringify(Object.assign({ fit: false }, JSON.parse(pre['sp.panel'] || '{}'))); }
    window.SP_PRESET_SETTINGS = pre;
  })();
</script>
<script src="mock-dashboard.js"></script>
<script>
  (function () {
    var q = new URLSearchParams(location.search), M = window.SP_MOCK, zone = document.getElementById('zone');
    Object.keys(window.SP_PRESET_SETTINGS).forEach(function (k) { M.settings[k] = String(window.SP_PRESET_SETTINGS[k]); });
    if (q.get('solo')) document.body.classList.add('solo');
    function placeZone (o) { zone.style.left = o.position.x + 'px'; zone.style.top = o.position.y + 'px'; zone.style.width = o.size.width + 'px'; zone.style.height = o.size.height + 'px'; }
    if (q.get('zone')) {
      var p = q.get('zone').split('x').map(Number);
      M.me.isFloating = false; M.me.size = { width: p[0], height: p[1] }; M.me.position = { x: 1440 - p[0] - 16, y: 16 };
    }
    placeZone(M.me);
    M.onZone = placeZone;
    function show () {
      M.sheets.forEach(function (ws, i) {
        var lines = Object.keys(ws.filters).map(function (k) {
          var f = ws.filters[k];
          if (f.filterType === 'categorical') return k + ': ' + (f.isAllSelected ? 'All' : (f.isExcludeMode ? 'excluding ' : '') + f.appliedValues.map(function (d) { return d.formattedValue; }).slice(0, 4).join(', ') + (f.appliedValues.length > 4 ? ' and ' + (f.appliedValues.length - 4) + ' more' : ''));
          if (f.filterType === 'range') return k + ': ' + f.minValue.formattedValue + ' to ' + f.maxValue.formattedValue + (f.includeNullValues ? '' : ', no empty values');
          if (f.filterType === 'relative-date') return k + ': ' + f.rangeType + ' ' + f.rangeN + ' ' + f.periodType + ' from ' + f.anchorDate.formattedValue;
          return k + ': ' + f.filterType + ' (not editable)';
        });
        lines.push('Rows shown: ' + M.view(ws).length);
        if (ws.selected) lines.push('Highlighted: ' + ws.selected.field + ' = ' + ws.selected.values.join(', '));
        document.querySelector('#s' + i + ' pre').textContent = lines.join('\n');
      });
      document.querySelector('#pp pre').textContent = M.params.map(function (p) { return p.name + ': ' + p.currentValue.formattedValue; }).join('\n');
    }
    show();
    var n = M.calls.length;
    setInterval(function () { if (M.calls.length !== n) { n = M.calls.length; show(); } }, 100);
  })();
</script>
<script src="../lib/ctab-panel/ctab-panel.js"></script>
<script src="../src/js/model.js"></script>
<script src="../src/js/panel.js"></script>
<script src="../src/js/app.js"></script>
</body>
</html>
